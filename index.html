<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İslami Kutlama ve Mesaj Kartı Oluşturucu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas for card download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --card-glow: 0.65;
            --card-shimmer: 0.7;
            --card-overlay: 0.75;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at top, rgba(251,191,36,0.10), transparent 22%),
                radial-gradient(circle at bottom right, rgba(14,165,233,0.08), transparent 24%),
                linear-gradient(180deg, #020617 0%, #0f172a 100%);
        }

        .font-arabic { font-family: 'Amiri', serif; }
        .font-display { font-family: 'Playfair Display', serif; }

        .glow-effect {
            text-shadow: 0 0 18px rgba(255, 215, 0, 0.7), 0 0 36px rgba(255, 215, 0, 0.35);
        }

        .card-shadow {
            box-shadow: 0 24px 48px -18px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255,255,255,0.05);
        }

        .light-ray {
            background: linear-gradient(135deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0) 58%);
            opacity: calc(0.4 + var(--card-shimmer) * 0.7);
        }

        #previewCard {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            transform: translate3d(0,0,0);
        }

        #previewCard::before {
            content: "";
            position: absolute;
            inset: -18%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, calc(0.16 + var(--card-glow) * 0.45)), transparent 38%);
            filter: blur(28px);
            opacity: 0.9;
            z-index: 0;
            animation: pulseGlow 7s ease-in-out infinite alternate;
        }

        #previewCard::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02), rgba(255,255,255,0.08));
            background-size: 200% 200%;
            animation: sheen 10s ease-in-out infinite alternate;
            z-index: 1;
            pointer-events: none;
        }

        .spark {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 999px;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 12px rgba(255,255,255,0.9), 0 0 28px rgba(255,215,0,0.65);
            opacity: 0.7;
            animation: twinkle 4s ease-in-out infinite alternate;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.96) translateY(-4px); opacity: 0.7; }
            100% { transform: scale(1.04) translateY(4px); opacity: 1; }
        }

        @keyframes sheen {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes twinkle {
            0% { transform: scale(0.6); opacity: 0.2; }
            50% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.8; }
        }

        @media (max-width: 640px) {
            #previewCard { aspect-ratio: 4 / 5.2; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 md:p-8">

    <div class="max-w-4xl w-full mx-auto space-y-8">
        <!-- Başlık -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl md:text-4xl font-display font-bold text-amber-400 tracking-wide">Nurî Mesaj ve Kart Tasarımcısı</h1>
            <p class="text-slate-400 text-sm md:text-base">Cuma, Bayram ve Kandil mesajlarınızı Hadisler, Ayetler ve Özel Dualarla Paylaşın.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
            
            <!-- Sol Panel: Kontroller ve Seçimler -->
            <div class="md:col-span-5 space-y-6 bg-slate-900/80 p-6 rounded-2xl border border-slate-800 backdrop-blur-md">
                
                <!-- Mesaj Türü (Cuma, Bayram, Kandil, Hadis, Ayet) -->
                <div>
                    <label class="block text-sm font-medium text-amber-300 mb-2">İçerik Kategorisi</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setContentType('cuma')" id="btnCuma" class="py-2 px-3 text-xs md:text-sm rounded-xl font-medium bg-amber-500 text-slate-950 transition">Cuma Mesajları</button>
                        <button onclick="setContentType('bayram')" id="btnBayram" class="py-2 px-3 text-xs md:text-sm rounded-xl font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Bayram Mesajları</button>
                        <button onclick="setContentType('kandil')" id="btnKandil" class="py-2 px-3 text-xs md:text-sm rounded-xl font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Kandil Mesajları</button>
                        <button onclick="setContentType('quran')" id="btnQuran" class="py-2 px-3 text-xs md:text-sm rounded-xl font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Kur'an Ayetleri</button>
                    </div>
                </div>

                <!-- İçerik Seçimi -->
                <div>
                    <label class="block text-sm font-medium text-amber-300 mb-2">Metin ve Söz Seçimi</label>
                    <select id="contentSelect" onchange="updateContentText()" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                        <!-- Dinamik olarak doldurulacak -->
                    </select>
                </div>

                <!-- Özel Dilek/Kutlama Başlığı -->
                <div>
                    <label class="block text-sm font-medium text-amber-300 mb-2">Kart Üst Başlığı</label>
                    <input type="text" id="greetingInput" value="Hayırlı Cumalar" oninput="updateGreeting()" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500" placeholder="Örn: Hayırlı Cumalar, Bayramınız Mübarek Olsun...">
                </div>

                <!-- Arka Plan Görseli -->
                <div>
                    <label class="block text-sm font-medium text-amber-300 mb-2">Arka Plan Tema Resmi</label>
                    <select id="bgSelect" onchange="updateBackground()" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                        <option value="https://images.unsplash.com/photo-1564769625405-49e095204fb9?auto=format&fit=crop&w=1200&q=80">Görkemli Camii Silüeti</option>
                        <option value="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80">Huzurlu Orman & Işık Süzmesi</option>
                        <option value="https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=1200&q=80">Bahar Çiçekleri ve Zarif Zemin</option>
                        <option value="https://images.unsplash.com/photo-1519817650390-64a93db51149?auto=format&fit=crop&w=1200&q=80">İslami Mimari & Geometrik Motif</option>
                        <option value="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80">Altın Işıklı Gece ve Hilal Dokusu</option>
                    </select>
                </div>

                <!-- Işık Efekti Yoğunluğu -->
                <div>
                    <label class="block text-sm font-medium text-amber-300 mb-2">Işık ve Gölge Yoğunluğu</label>
                    <input type="range" id="effectRange" min="0" max="100" value="60" oninput="updateEffects()" class="w-full accent-amber-500 cursor-pointer">
                </div>

                <!-- İmza / Gönderen Adı -->
                <div>
                    <label class="block text-sm font-medium text-amber-300 mb-2">Gönderen Adı (İmza)</label>
                    <input type="text" id="signatureInput" value="Hayırlı Dualarla" oninput="updateSignature()" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                </div>

            </div>

            <!-- Sağ Panel: Canlı Önizleme ve Paylaşım -->
            <div class="md:col-span-7 flex flex-col space-y-6">
                
                <!-- Önizleme Kartı -->
                <div id="previewCard" class="relative w-full aspect-[4/5] rounded-3xl overflow-hidden card-shadow flex flex-col justify-between p-8 text-white transition-all duration-500">
                    <div id="cardBg" class="absolute inset-0 bg-cover bg-center transition-all duration-700" style="background-image: url('https://images.unsplash.com/photo-1564769625405-49e095204fb9?auto=format&fit=crop&w=1200&q=80');"></div>
                    <div id="cardOverlay" class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/70 to-slate-950/40 transition-all duration-500"></div>
                    <div class="absolute inset-0 light-ray pointer-events-none"></div>

                    <div class="spark" style="top: 15%; left: 20%; animation-delay: .2s;"></div>
                    <div class="spark" style="top: 28%; right: 18%; animation-delay: 1.3s;"></div>
                    <div class="spark" style="bottom: 22%; left: 28%; animation-delay: 2.6s;"></div>
                    <div class="spark" style="bottom: 18%; right: 26%; animation-delay: 3.2s;"></div>

                    <div class="relative z-10 text-center space-y-1">
                        <span id="displayGreeting" class="inline-block text-amber-400 font-display text-lg md:text-xl tracking-wider font-semibold uppercase glow-effect">Hayırlı Cumalar</span>
                        <div class="w-16 h-0.5 bg-amber-500/60 mx-auto mt-2"></div>
                    </div>

                    <div class="relative z-10 text-center my-auto space-y-4 px-2">
                        <p id="displayText" class="font-arabic text-xl md:text-2xl leading-relaxed text-slate-100 drop-shadow-md">
                            "Kalpler ancak Allah'ı anmakla huzur bulur."
                        </p>
                        <p id="displaySource" class="text-xs md:text-sm text-amber-300/90 font-medium tracking-wide">
                            (Kaynak: cumamesajlari.org / Ra'd Suresi 28. Ayet)
                        </p>
                    </div>

                    <div class="relative z-10 flex justify-between items-end pt-4 border-t border-white/10">
                        <div class="text-[11px] text-slate-400 tracking-wider">NURÎ İSLAMİ KARTLAR</div>
                        <div id="displaySignature" class="text-sm font-semibold text-amber-300 italic">Hayırlı Dualarla</div>
                    </div>

                </div>

                <!-- Paylaşım ve İndirme Butonları -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <button onclick="copyCardText()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 px-4 rounded-xl text-sm transition flex items-center justify-center space-x-2 border border-slate-700">
                        <span>📝 Metni Kopyala</span>
                    </button>
                    <button onclick="downloadCardImage()" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-semibold py-3 px-4 rounded-xl text-sm transition flex items-center justify-center space-x-2 shadow-lg shadow-amber-900/20">
                        <span>📥 Kartı Resim İndir</span>
                    </button>
                    <button onclick="shareWhatsApp()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition flex items-center justify-center space-x-2 shadow-lg shadow-emerald-900/20">
                        <span>💬 WhatsApp'ta Paylaş</span>
                    </button>
                </div>

            </div>

        </div>
    </div>

    <script>
        const dataStore = {
            cuma: [
                { text: "“Kalpler ancak Allah'ı anmakla huzur bulur.”", source: "Kaynak: Ra'd Suresi, 28. Ayet (cumamesajlari.org)" },
                { text: "“Şüphesiz Allah sabredenlerle beraberdir. Bu Cuma sabırla beklenen her hayrın vakti olsun.”", source: "Kaynak: Bakara Suresi, 153. Ayet (cumamesajlari.org)" },
                { text: "“Her zorlukla beraber bir kolaylık vardır. Cuma, umutları tazeleyen bir rahmet günüdür.”", source: "Kaynak: İnşirah Suresi, 6. Ayet (cumamesajlari.org)" },
                { text: "“Rabbim yüreğimize ferahlık, ömrümüze bereket, kazancımıza helallik nasip eyle.”", source: "Kaynak: Cuma Mesajları (cumamesajlari.org)" },
                { text: "“Cuma; aşkın, duanın ve vuslatın adıdır. Gönüller duada birleşsin.”", source: "Kaynak: Özel Cuma Sözleri (cumamesajlari.org)" }
            ],
            bayram: [
                { text: "“Rabbim birliğimizi, beraberliğimizi daim kılsın. Sevdiklerinizle birlikte huzur dolu, bereketli ve sağlık dolu bir bayram geçirmeniz dileğiyle.”", source: "Kaynak: Bayram Mesajları Havuzu" },
                { text: "“Küskünlerin barıştığı, sevenlerin bir araya geldiği, rahmet ve bereket dolu bir bayram dilerim. Bayramınız mübarek olsun.”", source: "Kaynak: Bayram Mesajları Havuzu" },
                { text: "“Mübarek Bayram günlerinin coşkusu hanenize huzur, kalbinize iman ve neşe getirsin. Dualarınız kabul olsun.”", source: "Kaynak: Bayram Özel Mesajı" }
            ],
            kandil: [
                { text: "“Bu mübarek kandil gecesinde edilen tüm samimi duaların göğe yükselip rahmet olarak hanelerinize yağmasını dilerim.”", source: "Kaynak: Kandil Mesajları Havuzu" },
                { text: "“Allah'ım! Sen affedicisin, affetmeyi seversin, bizi de bu mübarek kandil gecesi hürmetine affeyle.”", source: "Kaynak: Tirmizî, Deavât, 84 (Kandil Özel)" },
                { text: "“Kandiliniz mübarek olsun. Bu gece dualarda buluşmak ve gönülleri bir kılmak dile" }
            ],
            quran: [
                { text: "“Bana dua edin, duanıza icabet edeyim.”", source: "Kaynak: Mü’min Suresi, 60. Ayet (Diyanet Meali)" },
                { text: "“Şüphesiz güçlükle beraber bir kolaylık vardır. Gerçekten, güçlükle beraber bir kolaylık vardır.”", source: "Kaynak: İnşirah Suresi, 5-6. Ayetler (Diyanet Meali)" },
                { text: "“Allah kimseye gücünün üstünde bir yük yüklemez.”", source: "Kaynak: Bakara Suresi, 286. Ayet (Diyanet Meali)" }
            ]
        };

        let currentType = 'cuma';

        function updateBackground() {
            const bgSelect = document.getElementById('bgSelect');
            const cardBg = document.getElementById('cardBg');
            cardBg.style.backgroundImage = `url('${bgSelect.value}')`;
        }

        function setContentType(type) {
            currentType = type;
            const buttons = [
                document.getElementById('btnCuma'),
                document.getElementById('btnBayram'),
                document.getElementById('btnKandil'),
                document.getElementById('btnQuran')
            ];

            buttons.forEach(btn => {
                btn.className = 'py-2 px-3 text-xs md:text-sm rounded-xl font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
            });

            const active = {
                cuma: document.getElementById('btnCuma'),
                bayram: document.getElementById('btnBayram'),
                kandil: document.getElementById('btnKandil'),
                quran: document.getElementById('btnQuran')
            };

            active[type].className = 'py-2 px-3 text-xs md:text-sm rounded-xl font-medium bg-amber-500 text-slate-950 transition';
            updateContentOptions();
        }

        function updateContentOptions() {
            const select = document.getElementById('contentSelect');
            const items = dataStore[currentType];
            select.innerHTML = '';

            items.forEach((item, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = item.text.substring(0, 50) + '...';
                select.appendChild(option);
            });

            updateContentText();
        }

        function updateContentText() {
            const index = document.getElementById('contentSelect').value;
            const item = dataStore[currentType][index];
            document.getElementById('displayText').textContent = item.text;
            document.getElementById('displaySource').textContent = item.source ? `(${item.source})` : '';
        }

        function updateGreeting() {
            const val = document.getElementById('greetingInput').value.trim();
            document.getElementById('displayGreeting').textContent = val || 'Hayırlı Cumalar';
        }

        function updateSignature() {
            const val = document.getElementById('signatureInput').value.trim();
            document.getElementById('displaySignature').textContent = val || 'Hayırlı Dualarla';
        }

        function updateEffects() {
            const val = Number(document.getElementById('effectRange').value) / 100;
            const card = document.getElementById('previewCard');
            const overlay = document.getElementById('cardOverlay');
            const root = document.documentElement;

            root.style.setProperty('--card-glow', (0.35 + val * 0.9).toFixed(2));
            root.style.setProperty('--card-shimmer', (0.25 + val * 1.2).toFixed(2));
            root.style.setProperty('--card-overlay', (0.45 + val * 0.7).toFixed(2));

            card.style.boxShadow = `0 26px 52px -20px rgba(0,0,0,${0.65 + val * 0.25}), 0 0 ${18 + val * 28}px rgba(251,191,36,${0.18 + val * 0.22})`;
            overlay.style.background = `linear-gradient(to top, rgba(15, 23, 42, ${0.82 - val * 0.15}) 0%, rgba(15, 23, 42, ${0.65 - val * 0.13}) 35%, rgba(15, 23, 42, ${0.36 - val * 0.08}) 100%)`;
        }

        function copyCardText() {
            const greeting = document.getElementById('displayGreeting').textContent;
            const text = document.getElementById('displayText').textContent;
            const source = document.getElementById('displaySource').textContent;
            const sig = document.getElementById('displaySignature').textContent;
            const fullText = `${greeting}\n\n${text}\n${source}\n\n-- ${sig}`;

            navigator.clipboard.writeText(fullText).then(() => {
                alert('Mesaj metni kopyalandı!');
            }).catch(() => {
                alert('Tarayıcı izin gerektiriyor.');
            });
        }

        function downloadCardImage() {
            const card = document.getElementById('previewCard');
            html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'islami-mesaj-karti.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function shareWhatsApp() {
            const greeting = document.getElementById('displayGreeting').textContent.trim();
            const text = document.getElementById('displayText').textContent.trim();
            const source = document.getElementById('displaySource').textContent.trim().replace(/^\(|\)$/g, '');
            const sig = document.getElementById('displaySignature').textContent.trim();

            const message = `${greeting}\n\n${text}\n\n${source}\n\nSaygılarımla,\n${sig}`;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;

            try {
                window.open(url, '_blank');
            } catch (e) {
                window.location.href = url;
            }
        }

        window.onload = function () {
            updateContentOptions();
            updateBackground();
            updateGreeting();
            updateSignature();
            updateEffects();
        };
    </script>
</body>
</html>
